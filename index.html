<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<title>Física da Princesinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --bg2:#efebe4; --card:#fbfaf7; --line:#e3ddd3; --line2:#d6cec2;
  --ink:#23211e; --ink2:#4b4640; --muted:#857d73;
  --acc:#34507a; --acc-ink:#2a4166; --acc-soft:rgba(52,80,122,.075); --acc-line:rgba(52,80,122,.28);
  --ok:#4c7856; --ok-soft:rgba(76,120,86,.09); --bad:#a3483e; --bad-soft:rgba(163,72,62,.08);
  --gold:#b8964f;
  --w1:#6f8f9c; --w2:#b48365;
  --sim-bg:#f9f7f3; --sim-line:#3a3631;
  --shadow:0 1px 2px rgba(35,33,30,.04),0 10px 28px -16px rgba(35,33,30,.16);
  --ease:cubic-bezier(.22,.61,.36,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --radius:16px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#141518; --bg2:#1b1d21; --card:#1a1c20; --line:#2a2d33; --line2:#363a41;
  --ink:#ebe7e0; --ink2:#c4bfb7; --muted:#8e897f;
  --acc:#a3b8dc; --acc-ink:#bccbe6; --acc-soft:rgba(163,184,220,.09); --acc-line:rgba(163,184,220,.32);
  --ok:#8db896; --ok-soft:rgba(141,184,150,.11); --bad:#d98b7f; --bad-soft:rgba(217,139,127,.11);
  --gold:#cfb072;
  --w1:#8fb0bd; --w2:#cf9f80;
  --sim-bg:#17191c; --sim-line:#d8d4cd;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 30px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141518; --bg2:#1b1d21; --card:#1a1c20; --line:#2a2d33; --line2:#363a41;
    --ink:#ebe7e0; --ink2:#c4bfb7; --muted:#8e897f;
    --acc:#a3b8dc; --acc-ink:#bccbe6; --acc-soft:rgba(163,184,220,.09); --acc-line:rgba(163,184,220,.32);
    --ok:#8db896; --ok-soft:rgba(141,184,150,.11); --bad:#d98b7f; --bad-soft:rgba(217,139,127,.11);
    --gold:#cfb072;
    --w1:#8fb0bd; --w2:#cf9f80;
    --sim-bg:#17191c; --sim-line:#d8d4cd;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 30px -18px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background-color .4s var(--ease),color .4s var(--ease)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:var(--acc)}
b,strong{font-weight:700}
.ic{flex:none;display:inline-block;vertical-align:middle}
.wrap{max-width:740px;margin:0 auto;padding:0 20px 96px}
.serif{font-family:var(--serif);font-weight:400}
.num{font-variant-numeric:tabular-nums}

/* ---------- barra superior ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.topbar-in{max-width:740px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px;min-height:58px}
.topbar .ttl{flex:1;min-width:0;font-family:var(--serif);font-size:1.3rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s var(--ease)}
.iconbtn{border:1px solid var(--line);background:transparent;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;color:var(--ink2);transition:transform .2s var(--ease),background-color .2s,border-color .2s,opacity .25s}
.iconbtn:hover{background:var(--card);border-color:var(--line2)}
.iconbtn:active{transform:scale(.92)}
.iconbtn{transition:transform .2s var(--ease),background-color .2s,border-color .2s,opacity .25s,width .3s var(--ease),margin .3s var(--ease)}
.iconbtn.hide{opacity:0;pointer-events:none;width:0;margin-right:-10px;border-width:0}
.pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 10px;font-weight:600;font-size:.85rem;white-space:nowrap;flex:none;color:var(--ink2)}
.pill .ic{color:var(--gold)}
.pill.bump{animation:bump .5s var(--ease-out)}
@keyframes bump{40%{transform:scale(1.08)}}

/* ---------- transições de tela ---------- */
#app{transition:opacity .16s var(--ease),transform .16s var(--ease)}
#app.leaving{opacity:0;transform:translateY(-6px)}
.rise{animation:rise .6s var(--ease-out) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- home ---------- */
.hero{padding:40px 0 8px}
.overline{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-family:var(--serif);font-weight:400;font-size:3rem;line-height:1.02;letter-spacing:-.015em;margin:10px 0 12px}
.hero h1 em{color:var(--acc)}
.hero p{margin:0;color:var(--ink2);max-width:34ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:30px 0 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:16px 4px;text-align:left}
.stat+.stat{border-left:1px solid var(--line);padding-left:16px}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:2rem;line-height:1.1}
.stat>span{font-size:.78rem;color:var(--muted);font-weight:600}
.bar{height:3px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--acc);border-radius:999px;transition:width 1.1s var(--ease-out)}
.prog-label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-weight:600;margin-top:8px}
.section-title{font-family:var(--serif);font-weight:400;font-size:1.75rem;margin:48px 0 14px;letter-spacing:-.01em}
.world{margin-bottom:28px}
.world-h{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.world-h .em{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--wc);border:1px solid color-mix(in srgb,var(--wc) 45%,transparent);background:color-mix(in srgb,var(--wc) 8%,transparent)}
.world-h h2{margin:2px 0 0;font-family:var(--serif);font-weight:400;font-size:1.45rem;line-height:1.15}
.world-h .overline{color:var(--wc)}
.lesson-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 4px;position:relative;transition:background-color .25s var(--ease)}
.lesson-item:hover{background:color-mix(in srgb,var(--card) 70%,transparent)}
.lesson-item:active .t{transform:translateX(3px)}
.lesson-item .n{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);background:var(--bg2);flex:none}
.lesson-item .t{flex:1;min-width:0;transition:transform .25s var(--ease)}
.lesson-item .t b{display:block;font-weight:600;line-height:1.35}
.lesson-item .t small{display:block;color:var(--muted);font-size:.83rem;line-height:1.4;margin-top:2px}
.lesson-item .s{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.lesson-item .chev{color:var(--muted);transition:transform .25s var(--ease)}
.lesson-item:hover .chev{transform:translateX(3px);color:var(--ink)}
.minibar{height:2px;background:var(--line);border-radius:9px;margin-top:10px;overflow:hidden;max-width:220px}
.minibar>i{display:block;height:100%;width:0;background:var(--wc);transition:width 1s var(--ease-out) .2s}
.stars{display:inline-flex;gap:2px;color:var(--line2)}
.stars .on{color:var(--gold)}
.stars .on path{fill:currentColor}
.done-mark{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;color:var(--ok);letter-spacing:.04em;text-transform:uppercase}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.extra{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:18px 16px;text-align:left;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.extra:hover{border-color:var(--line2);box-shadow:var(--shadow);transform:translateY(-2px)}
.extra:active{transform:scale(.98)}
.extra .ic{color:var(--acc)}
.extra b{display:block;font-family:var(--serif);font-weight:400;font-size:1.3rem;margin-top:14px;line-height:1.2}
.extra small{color:var(--muted);font-size:.8rem;line-height:1.4;display:block;margin-top:2px}
.footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:44px;font-family:var(--serif);font-style:italic;font-size:1.05rem}

/* ---------- botões ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--acc);border-radius:12px;padding:13px 20px;font-weight:600;font-size:.95rem;background:var(--acc);color:var(--card);transition:transform .2s var(--ease),filter .2s,background-color .2s,box-shadow .25s}
:root[data-theme="dark"] .btn:not(.sec){color:#141518}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.sec){color:#141518}}
.btn::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.35),transparent 60%);opacity:0;transition:opacity .4s}
.btn:active{transform:scale(.97)}
.btn:active::after{opacity:1;transition:opacity 0s}
.btn:hover{filter:brightness(1.06);box-shadow:var(--shadow)}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.sec::after{background:radial-gradient(circle at var(--mx,50%) var(--my,50%),var(--acc-soft),transparent 60%)}
.btn.sec:hover{background:var(--card);filter:none}
.btn.ok{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.block{display:flex;width:100%}
.btn.small{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.next-row{margin-top:14px}

/* ---------- lição ---------- */
.lesson-head{margin:32px 0 6px}
.lesson-head h1{margin:8px 0 0;font-family:var(--serif);font-weight:400;font-size:2.4rem;line-height:1.05;letter-spacing:-.015em}
.lesson-head p{margin:10px 0 0;color:var(--ink2)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:22px 0 20px;padding:4px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;position:relative}
.tab{border:0;background:transparent;border-radius:10px;padding:8px 2px;font-weight:600;font-size:.78rem;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);position:relative;z-index:1;transition:color .25s var(--ease)}
.tab.on{color:var(--ink)}
.tab .dn{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.tab-ind{position:absolute;top:4px;bottom:4px;left:4px;border-radius:10px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--line);transition:transform .45s var(--ease-out),width .45s var(--ease-out)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 22px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-family:var(--serif);font-weight:400;font-size:1.6rem;line-height:1.15;letter-spacing:-.01em}
.card h4{margin:22px 0 6px;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card p{margin:10px 0}
.card ul,.card ol{padding-left:20px;margin:10px 0}
.card li{margin:6px 0}
.card li::marker{color:var(--muted)}
.warn{background:var(--acc-soft);border-left:2px solid var(--acc);border-radius:2px 12px 12px 2px;padding:14px 16px;margin:16px 0;color:var(--ink)}
.warn-h{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc-ink);margin-bottom:4px}
.warn ul{margin:6px 0 0}
.warn p{margin:4px 0 0}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--ink2);font-size:.95rem;border-top:1px solid var(--line);padding:14px 2px 2px;margin:16px 0 4px}
.tip>.ic{color:var(--gold);margin-top:2px}
.tip.box{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.formula{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 12px;margin:14px 0;text-align:center;font-family:var(--serif);font-size:1.55rem;line-height:1.3;overflow-x:auto}
.formula small{display:block;font-family:var(--sans);font-size:.8rem;color:var(--muted);margin-top:8px;line-height:1.45}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.1}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 .2em .05em}
.frac>span:last-child{padding:.05em .2em 0}
.sqrt{white-space:nowrap}
.sqrt>span{border-top:1px solid currentColor;padding:0 .15em}
table.t{width:100%;border-collapse:collapse;margin:14px 0;font-size:.9rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
table.t th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
table.t tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.mini-svg{display:block;margin:16px auto;max-width:100%;height:auto;color:var(--ink2)}
.sv-water{fill:var(--acc);opacity:.1}
.sv-acc-s{stroke:var(--w2)}.sv-acc-f{fill:var(--w2)}
.sv-v-s{stroke:var(--acc)}.sv-v-f{fill:var(--acc)}
.sv-a-s{stroke:var(--ok)}.sv-a-f{fill:var(--ok)}
.done-box{margin:22px 0 0}

/* ---------- simulações ---------- */
.sim{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:14px}
.sim canvas{display:block;width:100%;border-radius:10px;background:var(--sim-bg);touch-action:none;border:1px solid var(--line)}
.sim canvas.flash{animation:flash .45s var(--ease)}
@keyframes flash{from{opacity:.35}to{opacity:1}}
.ctrls{display:grid;gap:14px;margin-top:16px;padding:0 4px}
.ctrl>label{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:.85rem;margin-bottom:6px;color:var(--ink2)}
.ctrl label span{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(var(--acc),var(--acc)) 0/var(--p,50%) 100% no-repeat,var(--line2);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--line2);border-radius:2px}
input[type=range]::-moz-range-progress{height:2px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-8px;border-radius:50%;background:var(--card);border:1.5px solid var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.12);transition:transform .2s var(--ease)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--card);border:1.5px solid var(--acc)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-weight:600;font-size:.82rem;color:var(--ink2);transition:all .25s var(--ease)}
.seg button:active{transform:scale(.95)}
.seg button.on{border-color:var(--acc-line);background:var(--acc-soft);color:var(--acc-ink)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.readout div{background:var(--card);box-shadow:0 0 0 1px var(--line);padding:9px 12px;font-size:.78rem;color:var(--muted);font-weight:500}
.readout b{display:block;font-size:.98rem;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:11px 14px;margin-top:12px;font-weight:500;font-size:.9rem;line-height:1.5;animation:fadein .35s var(--ease)}
.alert .ic{margin-top:1px}
.alert.ok{background:var(--ok-soft);color:var(--ink)}.alert.ok .ic{color:var(--ok)}
.alert.bad{background:var(--bad-soft);color:var(--ink);animation:fadein .3s var(--ease),shake .45s var(--ease)}.alert.bad .ic{color:var(--bad)}
.alert.info{background:var(--bg2);color:var(--ink2)}.alert.info .ic{color:var(--acc)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.88rem;color:var(--ink2);cursor:pointer}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:20px;height:20px;border:1.5px solid var(--line2);border-radius:6px;background:var(--card);display:grid;place-items:center;flex:none;margin:0;cursor:pointer;transition:background-color .2s,border-color .2s}
input[type=checkbox]::after{content:"";width:10px;height:6px;border-left:1.6px solid var(--card);border-bottom:1.6px solid var(--card);transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .25s var(--ease-out)}
input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
input[type=checkbox]:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
input[type=checkbox]:disabled{opacity:.4}

/* ---------- exemplos ---------- */
.step{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);animation:fadein .4s var(--ease)}
.step .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:.75rem;font-weight:700;color:var(--muted);margin-top:1px}
.answer{display:flex;gap:10px;align-items:flex-start;background:var(--ok-soft);border-radius:12px;padding:12px 14px;font-weight:600;margin-top:10px;animation:fadein .4s var(--ease)}
.answer .ic{color:var(--ok);margin-top:2px}
.q-ex{font-weight:600}

/* ---------- quiz ---------- */
.qprog{display:flex;justify-content:space-between;font-weight:600;color:var(--muted);font-size:.8rem;margin-bottom:10px;letter-spacing:.02em}
.qtext{font-family:var(--serif);font-size:1.55rem;line-height:1.25;margin:20px 0 16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:transparent;border-radius:12px;padding:13px 14px;margin:8px 0;font-weight:500;line-height:1.4;transition:transform .2s var(--ease),border-color .25s,background-color .25s}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:.78rem;font-weight:700;color:var(--muted);transition:all .25s var(--ease)}
.opt .tx{flex:1}
.opt .mk{flex:none;width:22px;height:22px}
.opt:not(:disabled):hover{border-color:var(--acc-line);background:var(--acc-soft)}
.opt:not(:disabled):active{transform:scale(.985)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .45s var(--ease)}
.opt.wrong .L{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default;color:inherit}
.draw path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s var(--ease-out) .05s forwards}
.opt.right .draw{color:var(--ok)}.opt.wrong .draw{color:var(--bad)}
@keyframes draw{to{stroke-dashoffset:0}}

.fc-wrap{perspective:1400px;margin:14px 0}
.fc{position:relative;height:280px;transition:transform .75s var(--ease-out);transform-style:preserve-3d;cursor:pointer;outline:none}

.fc:active:not(.flip){transform:scale(.985)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.fc .front{background:var(--card);font-family:var(--serif);font-size:2rem;line-height:1.2;box-shadow:var(--shadow)}

.fc .back .frac,.fc .back .sqrt{font-family:var(--serif);font-size:1.3em}

.cl-item{display:flex;align-items:flex-start;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}

.cl-item button{border:0;background:none;color:var(--muted);padding:2px;border-radius:6px}

const STORE_KEY = 'fisica-princesinha-v1';
const DEFAULT_STATE = () => ({ steps: {}, quiz: {}, simulado: null, theme: null, checklist: { done: {}, custom: [] } });
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return DEFAULT_STATE();
    const s = Object.assign(DEFAULT_STATE(), JSON.parse(raw));
    s.checklist = Object.assign({ done: {}, custom: [] }, s.checklist || {});
    return s;
  } catch (e) { return DEFAULT_STATE(); }
}
let S = loadState();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* sem storage: segue sem salvar */ } }

const STEP_KEYS = ['teoria', 'sim', 'exemplos'];
function stepDone(id, k) { return !!(S.steps[id] && S.steps[id][k]); }
function markStep(id, k) {
  if (stepDone(id, k)) return false;
  S.steps[id] = S.steps[id] || {};
  S.steps[id][k] = true;
  save(); updateTop();
  return true;
}
function quizStars(id) {
  const q = S.quiz[id];
  if (!q) return 0;
  const r = q.best / q.total;
  return r >= 0.9 ? 3 : r >= 0.7 ? 2 : r >= 0.5 ? 1 : 0;
}
function lessonProgress(id) {
  let n = STEP_KEYS.filter(k => stepDone(id, k)).length;
  if (S.quiz[id]) n++;
  return n / 4;
}
function totalXP() {
  let xp = 0;
  for (const id in LESSONS) {
    xp += STEP_KEYS.filter(k => stepDone(id, k)).length * 20;
    if (S.quiz[id]) xp += S.quiz[id].best * 10;
  }
  if (S.simulado) xp += S.simulado.best * 10;
  xp += Object.values(S.checklist.done).filter(Boolean).length * 5;
  return xp;
}
function totalStars() { return Object.keys(LESSONS).reduce((a, id) => a + quizStars(id), 0); }
function overallProgress() {
  const ids = Object.keys(LESSONS);
  return ids.reduce((a, id) => a + lessonProgress(id), 0) / ids.length;
}

/* contador numérico rolando */
function countUp(el, to, from = 0, dur = 900) {
  if (!el) return;
  if (REDUCED || from === to) { el.textContent = to; return; }
  const t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

}

  els.forEach(el => {
    if (!el || el.nodeType !== 1) return;
    el.classList.remove('rise'); void el.offsetWidth;
    el.style.setProperty('--i', Math.min(i++, 12));
    el.classList.add('rise');
  });
}

/* brilho suave (substitui o confete) */
const fxCv = $('#fx');
let fxParts = [], fxRAF = null;
function celebrate(origin, n = 26) {
  if (REDUCED) return;
  const dpr = window.devicePixelRatio || 1;
  if (fxCv.width !== Math.round(innerWidth * dpr) || fxCv.height !== Math.round(innerHeight * dpr)) {
    fxCv.width = Math.round(innerWidth * dpr); fxCv.height = Math.round(innerHeight * dpr);
    fxCv.style.width = innerWidth + 'px'; fxCv.style.height = innerHeight + 'px';
  }
  let x = innerWidth / 2, y = innerHeight * 0.45;
  if (origin && origin.getBoundingClientRect) { const r = origin.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
  const cs = getComputedStyle(document.documentElement);
  const cols = [cs.getPropertyValue('--gold').trim(), cs.getPropertyValue('--acc').trim(), cs.getPropertyValue('--gold').trim()];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 0.6 + Math.random() * 2.4;
    fxParts.push({
      x: x + Math.cos(a) * 6, y: y + Math.sin(a) * 6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.2,
      r: 1.5 + Math.random() * 3.2, c: pick(cols), life: 0, max: 55 + Math.random() * 40, star: Math.random() < 0.45, rot: Math.random() * Math.PI,
    });
  }
  if (!fxRAF) fxRAF = requestAnimationFrame(fxStep);
}
function fxStep() {
  const ctx = fxCv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  fxParts.forEach(p => {
    p.life++; p.vx *= 0.96; p.vy = p.vy * 0.96 - 0.02; p.x += p.vx; p.y += p.vy; p.rot += 0.03;
    const k = p.life / p.max, a = k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85;
    ctx.save(); ctx.globalAlpha = Math.max(0, a) * 0.9; ctx.fillStyle = p.c; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.star) {
      const r = p.r * 1.8;
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.quadraticCurveTo(0, 0, 0, r); ctx.quadraticCurveTo(0, 0, -r, 0); ctx.quadraticCurveTo(0, 0, 0, -r); ctx.fill();
    } else { ctx.beginPath(); ctx.arc(0, 0, p.r * 0.6, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  });
  fxParts = fxParts.filter(p => p.life < p.max);
  if (fxParts.length) fxRAF = requestAnimationFrame(fxStep);
  else { ctx.clearRect(0, 0, innerWidth, innerHeight); fxRAF = null; }
}

/* ================= QUIZ (lições e simulado) ================= */
function runQuiz(box, questions, opts) {
  const qs = questions.map(q => {
    const order = shuffle(q.o.map((_, i) => i));
    return { q: q.q, o: order.map(i => q.o[i]), a: order.indexOf(q.a), e: q.e };
  });
  let i = 0, score = 0;
  function show() {
    const q = qs[i];
    box.innerHTML = `<div class="card">
      <div class="qprog"><span>Questão ${i + 1} de ${qs.length}</span><span>${score} ${score === 1 ? 'acerto' : 'acertos'}</span></div>
      <div class="bar"><i style="width:${(i / qs.length) * 100}%" data-w="${((i + 1) / qs.length) * 100}%"></i></div>
      <div class="qtext">${q.q}</div>
      ${q.o.map((o, k) => `<button class="opt" data-k="${k}"><span class="L">${String.fromCharCode(65 + k)}</span><span class="tx">${o}</span><span class="mk"></span></button>`).join('')}
      <div id="fb"></div>
    </div>`;
    growBars(box);
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
    stagger([box.firstElementChild]);
  }
  function answer(k) {
    const q = qs[i], ok = k === q.a;
    if (ok) score++;
    box.querySelectorAll('.opt').forEach(b => {
      b.disabled = true;
      const kk = +b.dataset.k;
      if (kk === q.a) { b.classList.add('right'); $('.mk', b).innerHTML = icon('check', 22, 'draw'); }
      else if (kk === k) { b.classList.add('wrong'); $('.mk', b).innerHTML = icon('x', 22, 'draw'); }
      else b.classList.add('dim');
    });
    $('#fb', box).innerHTML = `<div class="fb ${ok ? 'r' : 'w'}"><b>${ok ? pick(MSG_OK) : pick(MSG_ERR)}</b>${q.e}</div>
      <button class="btn block" style="margin-top:14px" id="nextQ">${i + 1 < qs.length ? 'Próxima' : 'Ver resultado'} ${icon('arrow', 18)}</button>`;
    if (ok) celebrate(box.querySelector('.opt.right'), 16);
    $('#nextQ', box).onclick = () => { i++; i < qs.length ? show() : finish(); };
    $('#nextQ', box).scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest' });
  }
  function finish() {
    opts.onFinish(score, qs.length);
    const r = score / qs.length;
    const st = r >= 0.9 ? 3 : r >= 0.7 ? 2 : r >= 0.5 ? 1 : 0;
    const msg = r === 1 ? 'Gabaritou, princesinha. Você é incrível!'
      : r >= 0.7 ? 'Muito bem! Você tá prontíssima.'
      : r >= 0.5 ? 'Tá indo bem! Revisa as explicações e tenta de novo pra ganhar mais estrelas.'
      : 'Sem stress, princesinha. Volta na aba Explica, dá uma olhadinha nas pegadinhas e tenta de novo. Você consegue!';
    box.innerHTML = `<div class="card result">
      <div class="overline">Resultado</div>
      <div class="score num"><span id="qsc">0</span><small>/${qs.length}</small></div>
      <div style="color:var(--muted);font-size:.85rem;font-weight:600">acertos</div>
      ${stars(st, 26)}
      <p>${msg}</p>
      <div class="row" style="justify-content:center;margin-top:20px">
        <button class="btn sec" id="retry">${icon('redo', 18)} Tentar de novo</button>
      </div>
    </div>${opts.endExtra ? opts.endExtra() : ''}`;
    countUp($('#qsc', box), score, 0, 800);
    $('#retry', box).onclick = () => runQuiz(box, questions, opts);
    stagger([...box.children]);
    if (r >= 0.7) setTimeout(() => celebrate($('.score', box), r === 1 ? 60 : 36), 300);
    window.scrollTo({ top: Math.max(0, box.getBoundingClientRect().top + scrollY - 80), behavior: REDUCED ? 'auto' : 'smooth' });
  }
  show();
}

const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const DEG = Math.PI / 180;

const PALS = {
  light: { ray: '#bf8f2a', rose: '#b5664b', ochre: '#b98232', blue: '#4f7cac', acc: '#34507a', sage: '#5a8964', red: '#a5473d', gray: '#7a7e86', gray2: '#b3b6bb',
    spec: ['#c4584a', '#cf8a45', '#c4a23e', '#6a9c68', '#4f7cac', '#7c62a6'] },

    spec: ['#e07a6b', '#e5a160', '#e3c565', '#8cc08a', '#7fa6d6', '#a68fd4'] },
};

const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
/* interpola suavemente os valores numéricos de `st` (chaves `keys`) e redesenha até assentar */
function smooth(st, keys, draw) {
  const D = {};
  keys.forEach(k => { D[k] = st[k]; });
  let raf = null, last = 0;
  const settle = () => keys.forEach(k => { D[k] = st[k]; });
  const tick = t => {
    const dt = Math.min(0.05, Math.max(0.001, (t - last) / 1000)); last = t;
    const a = 1 - Math.exp(-dt * 13);
    let moving = false;
    keys.forEach(k => {
      const target = st[k];
      if (typeof target !== 'number' || typeof D[k] !== 'number') { D[k] = target; return; }
      const d = target - D[k];
      if (Math.abs(d) > 1e-3 * (Math.abs(target) + 1)) { D[k] += d * a; moving = true; } else D[k] = target;
    });
    draw();
    raf = moving ? requestAnimationFrame(tick) : null;
  };
  return {
    D,
    kick() {
      if (REDUCED) { settle(); draw(); return; }
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
    },
    snap() { settle(); },
    stop() { cancelAnimationFrame(raf); raf = null; },
  };
}
function paintRange(el) { el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min) * 100) + '%'); }

function simShell(box, { height, controls }) {
  box.innerHTML = `<div class="sim"><canvas></canvas><div class="sim-alert"></div><div class="readout"></div><div class="ctrls">${controls}</div></div>`;
  const cv = $('canvas', box);
  const sh = { cv, ctx: cv.getContext('2d'), w: 0, h: height, box };
  sh.fit = () => {
    const dpr = window.devicePixelRatio || 1;
    sh.w = cv.clientWidth || box.clientWidth || 320;
    cv.width = Math.round(sh.w * dpr); cv.height = Math.round(height * dpr);
    cv.style.height = height + 'px';
    sh.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  sh.fit();
  box.querySelectorAll('input[type=range]').forEach(paintRange);
  sh.flash = () => { cv.classList.remove('flash'); void cv.offsetWidth; cv.classList.add('flash'); };
  sh.readout = html => { $('.readout', box).innerHTML = html; };
  let lastAlert = '';
  sh.alert = (cls, html) => {
    const key = cls + html;
    if (key === lastAlert) return;
    lastAlert = key;
    $('.sim-alert', box).innerHTML = html ? `<div class="alert ${cls}">${icon(cls === 'ok' ? 'check' : cls === 'bad' ? 'alert' : 'info', 18)}<div>${html}</div></div>` : '';
  };
  sh.pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  return sh;
}
const ro = (label, val) => `<div>${label}<b>${val}</b></div>`;
const sliderHTML = (id, label, min, max, step, val, unit = '') =>
  `<div class="ctrl"><label for="${id}">${label} <span id="${id}-v">${val}${unit}</span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
const segHTML = (id, items, on) =>
  `<div class="seg" id="${id}">${items.map(([k, l]) => `<button data-k="${k}" class="${k === on ? 'on' : ''}">${l}</button>`).join('')}</div>`;
function bindSlider(box, id, unit, fn, fmtFn) {
  const el = $('#' + id, box), out = $('#' + id + '-v', box);
  const upd = () => { const v = parseFloat(el.value); paintRange(el); out.textContent = (fmtFn ? fmtFn(v) : fmt(v)) + unit; fn(v); };
  el.addEventListener('input', upd);
  return { el, set(v) { el.value = v; paintRange(el); out.textContent = (fmtFn ? fmtFn(+el.value) : fmt(+el.value)) + unit; } };
}
function bindSeg(box, id, fn) {
  const seg = $('#' + id, box);
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    fn(b.dataset.k);
  });
}
function arrow(ctx, x1, y1, x2, y2, color, lw = 3, label, labelOff = 8) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  if (len < 2) return;
  const ux = dx / len, uy = dy / len, hs = Math.min(9, len * 0.45);
  ctx.save();
  ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = Math.max(1.4, lw * 0.6); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hs * 0.8, y2 - uy * hs * 0.8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - ux * hs - uy * hs * 0.55, y2 - uy * hs + ux * hs * 0.55);
  ctx.lineTo(x2 - ux * hs + uy * hs * 0.55, y2 - uy * hs - ux * hs * 0.55);
  ctx.closePath(); ctx.fill();
  if (label) {
    ctx.font = 'bold 13px Manrope, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x2 + ux * (labelOff + 6), y2 + uy * (labelOff + 6));
  }
  ctx.restore();
}
function text(ctx, s, x, y, color, size = 12, align = 'left', weight = '700') {
  ctx.save(); ctx.fillStyle = color; ctx.font = `${weight} ${size}px Manrope, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y); ctx.restore();
}
function line(ctx, x1, y1, x2, y2, color, lw = 2, dash) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw > 2 ? lw * 0.65 : lw; ctx.lineCap = 'round'; if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
/* faz um loop de animação; devolve stop() */
function loop(fn) {
  let raf, last = performance.now(), running = true;
  const step = t => { if (!running) return; const dt = Math.min(0.05, (t - last) / 1000); last = t; fn(dt); raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
  return () => { running = false; cancelAnimationFrame(raf); };
}
function onResize(sh, draw) {
  const h = () => { sh.fit(); draw(); };
  window.addEventListener('resize', h);
  return () => window.removeEventListener('resize', h);
}

const SIMS = {};

/* ---------- SIM 1: REFRAÇÃO ---------- */
SIMS[1] = function (box) {
  const MEIOS = [['1.00', 'Ar'], ['1.33', 'Água'], ['1.50', 'Vidro'], ['2.42', 'Diamante']];
  const st = { t1: 40, n1: 1.00, n2: 1.50, disp: false };
  const sh = simShell(box, {
    height: 300,
    controls: `
      ${sliderHTML('t1', 'Ângulo de incidência θ₁', 0, 89, 1, st.t1, '°')}
      <div class="ctrl"><label>Meio 1 (de cima)</label>${segHTML('m1', MEIOS, '1.00')}</div>
      ${sliderHTML('n1', 'n₁', 1, 2.5, 0.01, '1.00')}
      <div class="ctrl"><label>Meio 2 (de baixo)</label>${segHTML('m2', MEIOS, '1.50')}</div>
      ${sliderHTML('n2', 'n₂', 1, 2.5, 0.01, '1.50')}
      <label class="chk"><input type="checkbox" id="disp"> Luz branca (mostrar dispersão)</label>`,
  });
  const nameOf = n => { const m = MEIOS.find(([k]) => Math.abs(+k - n) < 0.005); return m ? m[1] : 'n = ' + fmt(n); };
  const sT = bindSlider(box, 't1', '°', v => { st.t1 = v; tw.kick(); }, v => v.toFixed(0));
  const sN1 = bindSlider(box, 'n1', '', v => { st.n1 = v; syncSeg(); tw.kick(); }, v => v.toFixed(2).replace('.', ','));
  const sN2 = bindSlider(box, 'n2', '', v => { st.n2 = v; syncSeg(); tw.kick(); }, v => v.toFixed(2).replace('.', ','));
  sN1.set(1); sN2.set(1.5);
  function syncSeg() {
    [['m1', st.n1], ['m2', st.n2]].forEach(([id, n]) => $('#' + id, box).querySelectorAll('button').forEach(b => b.classList.toggle('on', Math.abs(+b.dataset.k - n) < 0.005)));
  }
  bindSeg(box, 'm1', k => { st.n1 = +k; sN1.set(+k); tw.kick(); });
  bindSeg(box, 'm2', k => { st.n2 = +k; sN2.set(+k); tw.kick(); });
  $('#disp', box).onchange = e => { st.disp = e.target.checked; sh.flash(); draw(); };

  function draw() {
    const D = tw.D;
    const { ctx, w, h } = sh, cx = w / 2, cy = h / 2, R = Math.min(w * 0.46, h * 0.47);
    const txt = cssv('--sim-line');
    ctx.clearRect(0, 0, w, h);
    const tone = n => 0.04 + (n - 1) / 1.5 * 0.22;
    ctx.fillStyle = rgba(C.blue, tone(D.n1)); ctx.fillRect(0, 0, w, cy);
    ctx.fillStyle = rgba(C.acc, tone(D.n2)); ctx.fillRect(0, cy, w, h - cy);
    line(ctx, 0, cy, w, cy, txt, 2);
    line(ctx, cx, 8, cx, h - 8, txt, 1.5, [6, 5]);
    text(ctx, 'normal', cx + 6, 14, txt, 11);
    text(ctx, `${nameOf(D.n1)} (n₁ = ${fmt(D.n1)})`, 10, 16, txt, 12);
    text(ctx, `${nameOf(D.n2)} (n₂ = ${fmt(D.n2)})`, 10, h - 14, txt, 12);

    const t1 = D.t1 * DEG;
    const sinT2 = D.n1 * Math.sin(t1) / D.n2;
    const tir = sinT2 > 1;
    const L = D.n1 > D.n2 ? Math.asin(D.n2 / D.n1) / DEG : null;
    const ix = cx - R * Math.sin(t1), iy = cy - R * Math.cos(t1);
    // incidente
    line(ctx, ix, iy, cx, cy, C.ray, 4);
    arrow(ctx, ix, iy, (ix + cx) / 2, (iy + cy) / 2, C.ray, 4);
    // refletido
    const rx = cx + R * Math.sin(t1), ry = cy - R * Math.cos(t1);
    ctx.globalAlpha = tir ? 1 : 0.3;
    arrow(ctx, cx, cy, rx, ry, C.ray, tir ? 4 : 2.5);
    ctx.globalAlpha = 1;
    // refratado
    if (!tir) {
      if (st.disp) {
        const cores = C.spec;
        cores.forEach((c, k) => {
          const n2c = D.n2 + (k - 2.5) * 0.014;
          const s = D.n1 * Math.sin(t1) / n2c;
          if (s <= 1) { const a = Math.asin(s); arrow(ctx, cx, cy, cx + R * Math.sin(a), cy + R * Math.cos(a), c, 2.5); }
        });
        text(ctx, 'violeta desvia mais', cx + 8, cy + R * 0.95, C.spec[5], 11);
      } else {
        const t2 = Math.asin(sinT2);
        arrow(ctx, cx, cy, cx + R * Math.sin(t2), cy + R * Math.cos(t2), C.rose, 4);
      }
    }
    // arcos dos ângulos
    ctx.strokeStyle = txt; ctx.lineWidth = 1.5;
    if (D.t1 > 0) {
      ctx.beginPath(); ctx.arc(cx, cy, 34, -Math.PI / 2 - t1, -Math.PI / 2); ctx.stroke();
      text(ctx, `θ₁=${Math.round(D.t1)}°`, cx - 44 * Math.sin(t1 / 2) - 4, cy - 50 * Math.cos(t1 / 2), txt, 12, 'right');
    }
    let t2deg = null;
    if (!tir) {
      const t2 = Math.asin(sinT2); t2deg = t2 / DEG;
      if (t2 > 0.01 && !st.disp) {
        ctx.beginPath(); ctx.arc(cx, cy, 40, Math.PI / 2 - t2, Math.PI / 2); ctx.stroke();
        text(ctx, `θ₂=${fmt(t2deg, 1)}°`, cx + 50 * Math.sin(t2 / 2) + 4, cy + 56 * Math.cos(t2 / 2), txt, 12, 'left');
      }
    }
    sh.readout(
      ro('θ₂ (refração)', tir ? '— (não há)' : fmt(t2deg, 1) + '°') +
      ro('v no meio 1', fmt(3 / D.n1, 2) + '×10⁸ m/s') +
      ro('v no meio 2', fmt(3 / D.n2, 2) + '×10⁸ m/s') +
      ro('Ângulo limite L', L === null ? 'não existe (n₁ ≤ n₂)' : fmt(L, 1) + '°')
    );
    if (tir) sh.alert('bad', `REFLEXÃO TOTAL! θ₁ = ${Math.round(D.t1)}° &gt; L = ${fmt(L, 1)}°. A luz não sai: volta toda para o meio 1.`);
    else if (Math.abs(D.n1 - D.n2) < 0.005) sh.alert('info', 'Mesmo índice: a luz passa reto, sem desviar.');
    else if (D.n2 > D.n1) sh.alert('ok', 'Indo para meio MAIS refringente: o raio se APROXIMA da normal (θ₂ &lt; θ₁).');
    else sh.alert('info', `Indo para meio MENOS refringente: o raio se AFASTA da normal. Passe de L = ${fmt(L, 1)}° para ver a reflexão total!`);
  }
  // arrastar o raio incidente
  let drag = false;
  const setFromPointer = e => {
    const p = sh.pos(e), cx = sh.w / 2, cy = sh.h / 2;
    if (p.y >= cy) return;
    st.t1 = clamp(Math.round(Math.atan2(Math.abs(p.x - cx), cy - p.y) / DEG), 0, 89);
    sT.set(st.t1); tw.kick();
  };
  sh.cv.addEventListener('pointerdown', e => { drag = true; sh.cv.setPointerCapture(e.pointerId); setFromPointer(e); });
  sh.cv.addEventListener('pointermove', e => { if (drag) setFromPointer(e); });
  sh.cv.addEventListener('pointerup', () => { drag = false; });
  const tw = smooth(st, ['t1', 'n1', 'n2'], draw);
  draw();
  const off = onResize(sh, draw);
  return { stop() { off(); tw.stop(); }, redraw: draw };
};

/* ---------- SIM 2: LENTES ---------- */
SIMS[2] = function (box) {
  const st = { type: 'conv', f: 12, p: 30, ho: 6 };
  const sh = simShell(box, {
    height: 320,
    controls: `
      <div class="ctrl"><label>Tipo de lente</label>${segHTML('lt', [['conv', 'Convergente'], ['div', 'Divergente']], 'conv')}</div>
      ${sliderHTML('lp', 'Distância do objeto p', 2, 38, 0.5, st.p, ' cm')}
      ${sliderHTML('lf', 'Distância focal |f|', 6, 18, 0.5, st.f, ' cm')}
      <div class="row">${[['Câmera', 3], ['Em 2F', 2], ['Projetor', 1.5], ['No foco', 1], ['Lupa', 0.6]].map(([l, k]) => `<button class="btn sec" style="padding:7px 10px;font-size:.85rem" data-pre="${k}">${l}</button>`).join('')}</div>`,
  });
  const sP = bindSlider(box, 'lp', ' cm', v => { st.p = v; tw.kick(); });
  bindSlider(box, 'lf', ' cm', v => { st.f = v; tw.kick(); });
  bindSeg(box, 'lt', k => { st.type = k; sh.flash(); draw(); });
  box.querySelectorAll('[data-pre]').forEach(b => b.onclick = () => {
    if (st.type !== 'conv') { st.type = 'conv'; $('#lt', box).querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.k === 'conv')); }
    st.p = clamp(Math.round(st.f * +b.dataset.pre * 2) / 2, 2, 38); sP.set(st.p); tw.kick();
  });
  const SPAN = 80;
  function draw() {
    const D = tw.D;
    const { ctx, w, h } = sh, cx = w / 2, cy = h / 2, s = w / SPAN;
    const X = x => cx + x * s, Y = y => cy - y * s;
    const txt = cssv('--sim-line');
    ctx.clearRect(0, 0, w, h);
    const f = st.type === 'conv' ? D.f : -D.f, p = D.p, ho = D.ho;
    // eixo e marcas
    line(ctx, 0, cy, w, cy, txt, 1.5);
    [[-2 * D.f, '2F'], [-D.f, 'F'], [D.f, "F'"], [2 * D.f, "2F'"]].forEach(([x, l]) => {
      if (Math.abs(x) > SPAN / 2) return;
      line(ctx, X(x), cy - 5, X(x), cy + 5, txt, 2);
      text(ctx, l, X(x), cy + 16, txt, 12, 'center');
    });
    // lente
    const lh = Math.min(h * 0.44, 150);
    ctx.save(); ctx.strokeStyle = C.blue; ctx.fillStyle = rgba(C.blue, 0.12); ctx.lineWidth = 1.5; ctx.lineWidth = 3;
    ctx.beginPath();
    if (st.type === 'conv') { ctx.ellipse(cx, cy, 9, lh, 0, 0, Math.PI * 2); }
    else { ctx.moveTo(cx - 12, cy - lh); ctx.quadraticCurveTo(cx - 2, cy, cx - 12, cy + lh); ctx.lineTo(cx + 12, cy + lh); ctx.quadraticCurveTo(cx + 2, cy, cx + 12, cy - lh); ctx.closePath(); }
    ctx.fill(); ctx.stroke(); ctx.restore();

    const improper = st.type === 'conv' && Math.abs(p - f) < 0.25;
    const pi = improper ? Infinity : 1 / (1 / f - 1 / p);
    const A = improper ? Infinity : -pi / p;
    const hi = A * ho;
    const virtual = pi < 0;
    const RIGHT = SPAN / 2 + 5;
    const toEdge = (x0, y0, dx, dy) => { const t = (RIGHT - x0) / dx; return [x0 + dx * t, y0 + dy * t]; };
    const C1 = C.ochre, C2 = C.blue, C3 = C.sage;
    const ray = (pts, c, dash) => { ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = 1.6; if (dash) ctx.setLineDash([6, 5]); ctx.beginPath(); pts.forEach(([x, y], k) => k ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))); ctx.stroke(); ctx.restore(); };
    // raio 1: paralelo
    const d1 = f > 0 ? [f, -ho] : [-f, ho];
    ray([[-p, ho], [0, ho], toEdge(0, ho, d1[0], d1[1])], C1);
    // raio 2: centro
    ray([[-p, ho], [0, 0], toEdge(0, 0, p, -ho)], C2);
    // raio 3: pelo foco (ou mirando nele) → sai paralelo
    let y3 = null;
    if (!improper) { y3 = -ho * f / (p - f); if (Math.abs(y3) < 60) ray([[-p, ho], [0, y3], [RIGHT, y3]], C3); else y3 = null; }
    // prolongamentos (imagem virtual)
    if (virtual && isFinite(pi)) {
      ray([[0, ho], [pi, hi]], C1, true);
      ray([[0, 0], [pi, hi]], C2, true);
      if (y3 !== null) ray([[0, y3], [pi, hi]], C3, true);
    }
    // objeto
    arrow(ctx, X(-p), cy, X(-p), Y(ho), C.rose, 5);
    text(ctx, 'objeto', X(-p), Y(ho) - 12, C.rose, 12, 'center');
    // imagem
    if (isFinite(pi) && Math.abs(pi) < SPAN && Math.abs(hi) < 40) {
      ctx.save(); if (virtual) ctx.setLineDash([5, 4]);
      arrow(ctx, X(pi), cy, X(pi), Y(hi), C.acc, 5);
      ctx.restore();
      text(ctx, virtual ? 'imagem (virtual)' : 'imagem (real)', X(pi), Y(hi) + (hi > 0 ? -12 : 14), C.acc, 12, 'center');
    }
    // dica de arraste
    text(ctx, '↔ arraste o objeto', 8, 14, txt, 11);

    let nat, caso;
    if (improper) { nat = 'Imprópria (no infinito)'; caso = 'Objeto NO FOCO: os raios saem paralelos e não formam imagem.'; }
    else {
      nat = `${virtual ? 'Virtual' : 'Real'}, ${A > 0 ? 'direita' : 'invertida'}, ${Math.abs(Math.abs(A) - 1) < 0.03 ? 'mesmo tamanho' : Math.abs(A) > 1 ? 'maior' : 'menor'}`;
      if (st.type === 'div') caso = 'Lente divergente: SEMPRE virtual, direita e menor.';
      else if (Math.abs(p - 2 * f) < 0.25) caso = 'Objeto em 2F: imagem real, invertida e do mesmo tamanho.';
      else if (p > 2 * f) caso = 'Objeto além de 2F: real, invertida e menor — como na câmera e no olho';
      else if (p > f) caso = 'Objeto entre F e 2F: real, invertida e maior — como no projetor';
      else caso = 'Objeto entre F e a lente: virtual, direita e maior — é a LUPA!';
    }
    sh.readout(
      ro('p', fmt(p, 1) + ' cm') + ro('f', fmt(f, 1) + ' cm') +
      ro("p'", isFinite(pi) ? fmt(pi, 1) + ' cm' : '∞') + ro('A', isFinite(A) ? fmt(A, 2) : '∞') +
      `<div style="grid-column:1/-1">Imagem<b>${nat}</b></div>`
    );
    sh.alert(virtual || improper ? 'info' : 'ok', caso);
  }
  let drag = false;
  sh.cv.addEventListener('pointerdown', e => {
    const p = sh.pos(e), s = sh.w / SPAN;
    if (p.x < sh.w / 2 - 4 && Math.abs(p.x - (sh.w / 2 - st.p * s)) < 40) { drag = true; sh.cv.setPointerCapture(e.pointerId); move(e); }
  });
  const move = e => {
    const p = sh.pos(e), s = sh.w / SPAN;
    st.p = clamp(Math.round((sh.w / 2 - p.x) / s * 2) / 2, 2, 38);
    st.ho = clamp((sh.h / 2 - p.y) / s, 3, 12);
    sP.set(st.p); tw.kick();
  };
  sh.cv.addEventListener('pointermove', e => { if (drag) move(e); });
  sh.cv.addEventListener('pointerup', () => { drag = false; });
  const tw = smooth(st, ['p', 'f', 'ho'], draw);
  draw();
  const off = onResize(sh, draw);
  return { stop() { off(); tw.stop(); }, redraw: draw };
};

/* ---------- SIM 3: OLHO ---------- */
SIMS[3] = function (box) {
  const st = { eye: 'normal', obj: 'longe', glasses: false };
  const sh = simShell(box, {
    height: 260,
    controls: `
      <div class="ctrl"><label>Tipo de olho</label>${segHTML('ey', [['normal', 'Normal'], ['miopia', 'Miopia'], ['hiper', 'Hipermetropia'], ['presbiopia', 'Presbiopia']], 'normal')}</div>
      <div class="ctrl"><label>Onde está o objeto?</label>${segHTML('ob', [['longe', 'Longe'], ['perto', 'Perto']], 'longe')}</div>
      <label class="chk"><input type="checkbox" id="gl"> Colocar óculos corretivos</label>`,
  });
  const gl = $('#gl', box);
  bindSeg(box, 'ey', k => { st.eye = k; targets(); tw.kick(); });
  bindSeg(box, 'ob', k => { st.obj = k; targets(); tw.snap(); sh.flash(); draw(); });
  gl.onchange = () => { st.glasses = gl.checked; targets(); tw.kick(); };
  function targets() {
    const factor = st.eye === 'miopia' ? 1.15 : st.eye === 'hiper' ? 0.85 : 1;
    const useG = st.glasses && st.eye !== 'normal';
    let fr_;
    if (st.eye === 'normal' || useG) fr_ = factor;
    else if (st.eye === 'miopia') fr_ = st.obj === 'longe' ? 1 : factor;
    else if (st.eye === 'hiper') fr_ = st.obj === 'longe' ? 1 : 1.12;
    else fr_ = st.obj === 'longe' ? 1 : 1.18;
    st.factor = factor; st.fr = fr_; st.gA = useG ? 1 : 0;
  }
  function drawObj(ctx, x, y, color) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.beginPath();
    if (st.obj === 'longe') { ctx.moveTo(x - 12, y + 8); ctx.lineTo(x - 3, y - 6); ctx.lineTo(x + 2, y + 1); ctx.lineTo(x + 6, y - 3); ctx.lineTo(x + 13, y + 8); ctx.closePath(); }
    else { ctx.moveTo(x, y - 7); ctx.quadraticCurveTo(x - 6, y - 10, x - 12, y - 8); ctx.lineTo(x - 12, y + 8); ctx.quadraticCurveTo(x - 6, y + 6, x, y + 9); ctx.quadraticCurveTo(x + 6, y + 6, x + 12, y + 8); ctx.lineTo(x + 12, y - 8); ctx.quadraticCurveTo(x + 6, y - 10, x, y - 7); ctx.lineTo(x, y + 9); }
    ctx.stroke(); ctx.restore();
  }
  const INFO = {
    normal: 'Olho normal: acomoda sozinho e forma a imagem sempre na retina.',
    miopia: 'Miopia: olho alongado → imagem de objetos distantes ANTES da retina. Corrige com lente DIVERGENTE (−).',
    hiper: 'Hipermetropia: olho curto → imagem DEPOIS da retina (pior de perto). Corrige com lente CONVERGENTE (+).',
    presbiopia: 'Presbiopia: o cristalino perde a acomodação com a idade → não foca de perto. Corrige com lente CONVERGENTE (+).',
  };
  function draw() {
    const D = tw.D;
    const { ctx, w, h } = sh, txt = cssv('--sim-line');
    ctx.clearRect(0, 0, w, h);
    const ey = h / 2, ry = h * 0.36;
    const base = Math.min(w * 0.24, 170);
    const factor = D.factor;
    const lensX = w * 0.5;
    const Dn = base * 1.6;
    const retinaD = Dn * factor, retinaX = lensX + retinaD;
    const ex = lensX + retinaD / 2 - 6, rx = retinaD / 2 + 14;
    const focusD = Dn * D.fr;
    const fx = lensX + focusD;
    // globo ocular
    ctx.save();
    ctx.fillStyle = cssv('--card'); ctx.strokeStyle = txt; ctx.lineWidth = 1.5;

    // retina
    ctx.strokeStyle = C.red; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(ex, ey, rx, ry, 0, -0.9, 0.9); ctx.stroke();
    // cristalino
    ctx.fillStyle = rgba(C.blue, 0.22); ctx.strokeStyle = C.blue; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(lensX, ey, 9, ry * 0.55, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
    text(ctx, 'cristalino', lensX, ey + ry * 0.55 + 14, C.blue, 11, 'center');
    text(ctx, 'retina', retinaX - 4, ey - ry * 0.85, C.red, 11, 'center');
    // óculos
    const gx = lensX - 45;
    const gtype = st.eye === 'miopia' ? 'div' : 'conv';
    if (D.gA > 0.01) {
      ctx.save(); ctx.globalAlpha = D.gA;
      ctx.save(); ctx.strokeStyle = C.acc; ctx.fillStyle = rgba(C.acc, 0.12); ctx.lineWidth = 1.5;
      const gh = ry * 0.75;
      ctx.beginPath();
      if (gtype === 'conv') ctx.ellipse(gx, ey, 7, gh, 0, 0, Math.PI * 2);
      else { ctx.moveTo(gx - 9, ey - gh); ctx.quadraticCurveTo(gx, ey, gx - 9, ey + gh); ctx.lineTo(gx + 9, ey + gh); ctx.quadraticCurveTo(gx, ey, gx + 9, ey - gh); ctx.closePath(); }
      ctx.fill(); ctx.stroke(); ctx.restore();
      text(ctx, gtype === 'conv' ? 'lente +' : 'lente −', gx, ey - gh - 10, C.acc, 11, 'center');
      ctx.restore();
    }
    // objeto
    const srcX = 22;
    drawObj(ctx, srcX - 4, st.obj === 'longe' ? 26 : ey, txt);
    // raios
    const a = ry * 0.45;
    const useG = D.gA > 0.01;
    const k = 1 + ((gtype === 'div' ? 0.75 : 1.3) - 1) * D.gA;
    let hits = [];
    [-a, 0, a].forEach(yk => {
      const yl = ey + yk;
      const pts = [];
      if (st.obj === 'longe') {
        const y0 = ey + (useG ? yk * k : yk);
        pts.push([0, y0]);
        if (useG) pts.push([gx, y0]);
      } else {
        pts.push([srcX + 12, ey]);
        if (useG) pts.push([gx, ey + yk * (gx - srcX - 12) / (lensX - srcX - 12) * (1 + ((gtype === 'conv' ? 1.25 : 0.8) - 1) * D.gA)]);
      }
      pts.push([lensX, yl]);
      const m = (ey - yl) / (fx - lensX);
      const yRet = yl + m * (retinaX - lensX);
      ctx.save(); ctx.strokeStyle = C.ray; ctx.lineWidth = 1.8; ctx.beginPath();
      pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.lineTo(retinaX, yRet); ctx.stroke();
      if (fx > retinaX + 1) { ctx.setLineDash([4, 4]); ctx.globalAlpha = 0.7; ctx.beginPath(); ctx.moveTo(retinaX, yRet); ctx.lineTo(fx, ey); ctx.stroke(); }
      ctx.restore();
      hits.push(yRet);
    });
    const spread = Math.max(...hits) - Math.min(...hits);
    const sharp = spread < 3;
    ctx.save();
    if (sharp) { ctx.fillStyle = C.sage; ctx.beginPath(); ctx.arc(retinaX, ey, 6, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.fillStyle = rgba(C.red, 0.3); ctx.beginPath(); ctx.ellipse(retinaX, ey, 6, spread / 2 + 4, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
    if (Math.abs(fx - retinaX) > 2) {
      ctx.fillStyle = C.rose; ctx.beginPath(); ctx.arc(fx, ey, 4, 0, Math.PI * 2); ctx.fill();
      text(ctx, 'foco', fx, ey + 14, C.rose, 11, 'center');
    }
    let msg;
    if (sharp) msg = st.glasses && st.eye !== 'normal' ? `Com os óculos certos, a imagem caiu na retina! Nítido` : 'Imagem na retina: visão nítida!';
    else msg = (fx < retinaX ? 'Imagem ANTES da retina' : 'Imagem DEPOIS da retina') + ' → visão embaçada. Tente os óculos!';
    sh.alert(sharp ? 'ok' : 'bad', msg);
    sh.readout(`<div style="grid-column:1/-1">${INFO[st.eye]}</div>` +
      ro('Lente corretora', st.eye === 'normal' ? 'não precisa' : gtype === 'div' ? 'Divergente (grau −)' : 'Convergente (grau +)') +
      ro('Enxerga mal', { normal: '—', miopia: 'de longe', hiper: 'de perto', presbiopia: 'de perto' }[st.eye]));
    gl.disabled = st.eye === 'normal';
  }
  targets();
  const tw = smooth(st, ['factor', 'fr', 'gA'], draw);
  draw();
  const off = onResize(sh, draw);
  return { stop() { off(); tw.stop(); }, redraw: draw };
};

/* ---------- SIM 4: MCU ---------- */
SIMS[4] = function (box) {
  const st = { R: 2, f: 0.5, Rd: 2, fd: 0.5, phi: 0, vec: true, inner: false, paused: false, laps: 0, trail: [] };
  const sh = simShell(box, {
    height: 300,
    controls: `
      ${sliderHTML('mr', 'Raio R', 0.5, 3, 0.1, '2', ' m')}
      ${sliderHTML('mf', 'Frequência f', 0.1, 2, 0.05, '0,5', ' Hz')}
      <label class="chk"><input type="checkbox" id="mv" checked> Mostrar vetores (v e a꜀ₚ)</label>
      <label class="chk"><input type="checkbox" id="mi"> Mostrar ponto no meio do raio (R/2)</label>
      <button class="btn sec small" id="mp">${icon('pause', 16)} Pausar</button>`,
  });
  bindSlider(box, 'mr', ' m', v => { st.R = v; });
  bindSlider(box, 'mf', ' Hz', v => { st.f = v; });
  $('#mv', box).onchange = e => { st.vec = e.target.checked; draw(); };
  $('#mi', box).onchange = e => { st.inner = e.target.checked; draw(); };
  $('#mp', box).onclick = () => { st.paused = !st.paused; $('#mp', box).innerHTML = st.paused ? `${icon('play', 16)} Continuar` : `${icon('pause', 16)} Pausar`; };
  function draw() {
    const { ctx, w, h } = sh, cx = w / 2, cy = h / 2, txt = cssv('--sim-line');
    const maxR = Math.min(w, h) / 2 - 40, r = st.Rd / 3 * maxR;
    const T = 1 / st.fd, om = 2 * Math.PI * st.fd, v = om * st.Rd, a = om * om * st.Rd;
    ctx.clearRect(0, 0, w, h);
    ctx.save(); ctx.strokeStyle = txt; ctx.globalAlpha = 0.35; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    ctx.fillStyle = txt; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
    const px = cx + r * Math.cos(st.phi), py = cy - r * Math.sin(st.phi);
    line(ctx, cx, cy, px, py, txt, 1.5, [3, 3]);
    text(ctx, 'R', (cx + px) / 2 + 6, (cy + py) / 2 - 8, txt, 12);
    // rastro
    st.trail.push([px, py]); if (st.trail.length > 30) st.trail.shift();
    st.trail.forEach(([x, y], i) => { ctx.fillStyle = rgba(C.rose, i / 70); ctx.beginPath(); ctx.arc(x, y, 6 * i / 30, 0, Math.PI * 2); ctx.fill(); });
    if (st.vec) {
      const vl = 22 + v / (4 * Math.PI * 3) * 70;
      const al = 16 + Math.sqrt(a / (16 * Math.PI * Math.PI * 3)) * 60;
      const tx = -Math.sin(st.phi), ty = -Math.cos(st.phi);
      arrow(ctx, px, py, px + tx * vl, py + ty * vl, C.blue, 3.5, 'v');
      const ux = (cx - px) / r, uy = (cy - py) / r;
      arrow(ctx, px, py, px + ux * Math.min(al, r - 6), py + uy * Math.min(al, r - 6), C.sage, 3.5, 'a');
    }
    if (st.inner) {
      const ix = cx + r / 2 * Math.cos(st.phi), iy = cy - r / 2 * Math.sin(st.phi);
      ctx.fillStyle = C.ochre; ctx.beginPath(); ctx.arc(ix, iy, 7, 0, Math.PI * 2); ctx.fill();
      if (st.vec) arrow(ctx, ix, iy, ix - Math.sin(st.phi) * (11 + v / 2 / (4 * Math.PI * 3) * 70), iy - Math.cos(st.phi) * (11 + v / 2 / (4 * Math.PI * 3) * 70), C.ochre, 3);
    }
    ctx.fillStyle = C.rose; ctx.beginPath(); ctx.arc(px, py, 10, 0, Math.PI * 2); ctx.fill();
    text(ctx, `voltas: ${st.laps}`, 10, 16, txt, 12);
    sh.readout(
      ro('Período T', fmt(T, 2) + ' s') + ro('Frequência f', fmt(st.fd, 2) + ' Hz = ' + fmt(st.fd * 60, 0) + ' rpm') +
      ro('Vel. angular ω', fmt(om, 2) + ' rad/s') + ro('Vel. linear v', fmt(v, 2) + ' m/s') +
      ro('a꜀ₚ = v²/R', fmt(a, 2) + ' m/s²') +
      (st.inner ? ro('Ponto do meio (R/2)', `mesmo ω · v = ${fmt(v / 2, 2)} m/s`) : '')
    );
  }
  sh.alert('info', 'v é sempre TANGENTE · a꜀ₚ sempre aponta para o CENTRO. Dobre o raio e veja v dobrar!');
  const stopLoop = loop(dt => {
    const k = REDUCED ? 1 : 1 - Math.exp(-dt * 9);
    st.Rd += (st.R - st.Rd) * k; st.fd += (st.f - st.fd) * k;
    if (!st.paused) {
      const before = Math.floor(st.phi / (2 * Math.PI));
      st.phi += 2 * Math.PI * st.fd * dt;
      if (Math.floor(st.phi / (2 * Math.PI)) > before) st.laps++;
    }
    draw();
  });
  const off = onResize(sh, draw);
  return { stop() { stopLoop(); off(); }, redraw: draw };
};

/* ---------- SIM 5: TRANSMISSÃO ---------- */
SIMS[5] = function (box) {
  const st = { mode: 'correia', RA: 8, RB: 4, fA: 30, ncor: 48, ncat: 16, RAd: 8, RBd: 4, ncord: 48, ncatd: 16, fp: 60, phA: 0, phB: 0, belt: 0 };
  const sh = simShell(box, {
    height: 280,
    controls: `
      <div class="ctrl"><label>Tipo de ligação</label>${segHTML('tm', [['correia', 'Correia'], ['cruzada', 'Correia cruzada'], ['engrenagem', 'Engrenagens'], ['coaxial', 'Mesmo eixo'], ['bike', 'Bicicleta']], 'correia')}</div>
      <div id="tc"></div>`,
  });
  const tc = $('#tc', box);
  function controls() {
    if (st.mode === 'bike') {
      tc.innerHTML = `<div class="ctrls">${sliderHTML('bc', 'Dentes da coroa (frente)', 22, 52, 1, st.ncor)}${sliderHTML('bk', 'Dentes da catraca (trás)', 11, 34, 1, st.ncat)}${sliderHTML('bp', 'Pedalada', 20, 120, 5, st.fp, ' rpm')}</div>`;
      bindSlider(box, 'bc', '', v => { st.ncor = v; }, v => v.toFixed(0));
      bindSlider(box, 'bk', '', v => { st.ncat = v; }, v => v.toFixed(0));
      bindSlider(box, 'bp', ' rpm', v => { st.fp = v; }, v => v.toFixed(0));
    } else {
      tc.innerHTML = `<div class="ctrls">${sliderHTML('ra', 'Raio da roda A (motora)', 2, 10, 0.5, st.RA, ' cm')}${sliderHTML('rb', 'Raio da roda B', 2, 10, 0.5, st.RB, ' cm')}${sliderHTML('fa', 'Frequência de A', 10, 120, 5, st.fA, ' rpm')}</div>`;
      bindSlider(box, 'ra', ' cm', v => { st.RA = v; });
      bindSlider(box, 'rb', ' cm', v => { st.RB = v; });
      bindSlider(box, 'fa', ' rpm', v => { st.fA = v; }, v => v.toFixed(0));
    }
  }
  bindSeg(box, 'tm', k => { st.mode = k; st.phA = st.phB = 0; controls(); sh.flash(); });
  controls();

  function wheel(ctx, x, y, r, ph, color, gearN) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-ph);
    ctx.fillStyle = rgba(color, 0.1); ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    if (gearN) {
      ctx.beginPath();
      for (let i = 0; i < gearN; i++) {
        const a0 = i / gearN * 2 * Math.PI, da = Math.PI / gearN;
        ctx.lineTo(Math.cos(a0 - da / 2) * r, Math.sin(a0 - da / 2) * r);
        ctx.lineTo(Math.cos(a0 - da / 4) * (r + 7), Math.sin(a0 - da / 4) * (r + 7));
        ctx.lineTo(Math.cos(a0 + da / 4) * (r + 7), Math.sin(a0 + da / 4) * (r + 7));
        ctx.lineTo(Math.cos(a0 + da / 2) * r, Math.sin(a0 + da / 2) * r);
        ctx.lineTo(Math.cos(a0 + da * 1.5) * r, Math.sin(a0 + da * 1.5) * r);
      }
      ctx.closePath();
    } else { ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); }
    ctx.fill(); ctx.stroke();
    for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; line(ctx, 0, 0, Math.cos(a) * r * 0.85, Math.sin(a) * r * 0.85, color, 1.2); }
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(r * 0.7, 0, Math.max(3, r * 0.12), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  }
  function beltPath(ctx, xa, ra, xb, rb, y, crossed, off) {
    ctx.save(); ctx.strokeStyle = C.gray; ctx.lineWidth = 2; ctx.setLineDash([8, 6]); ctx.lineDashOffset = off;
    ctx.beginPath();
    if (!crossed) { ctx.moveTo(xa, y - ra - 2); ctx.lineTo(xb, y - rb - 2); ctx.moveTo(xb, y + rb + 2); ctx.lineTo(xa, y + ra + 2); }
    else { ctx.moveTo(xa, y - ra - 2); ctx.lineTo(xb, y + rb + 2); ctx.moveTo(xb, y - rb - 2); ctx.lineTo(xa, y + ra + 2); }
    ctx.stroke(); ctx.restore();
  }
  function ease(dt) {
    const k = REDUCED || !dt ? 1 : 1 - Math.exp(-dt * 9);
    ['RA', 'RB', 'ncor', 'ncat'].forEach(n => { st[n + 'd'] += (st[n] - st[n + 'd']) * k; });
  }
  function drawGears(dt) {
    ease(dt);
    const { ctx, w, h } = sh, cy = h / 2, txt = cssv('--sim-line');
    const k = Math.min(w * 0.2, h * 0.38) / 10;
    const rA = st.RAd * k, rB = st.RBd * k;
    const fA = st.fA / 60;
    const fB = st.mode === 'coaxial' ? fA : fA * st.RA / st.RB;
    const opposite = st.mode === 'cruzada' || st.mode === 'engrenagem';
    const vis = Math.min(1, 1.6 / Math.max(fA, fB));
    st.phA += 2 * Math.PI * fA * vis * dt;
    st.phB = st.mode === 'coaxial' ? st.phA : (opposite ? -1 : 1) * st.phA * st.RA / st.RB;
    ctx.clearRect(0, 0, w, h);
    let xA, xB;
    if (st.mode === 'coaxial') {
      xA = xB = w / 2;
      const order = rA >= rB ? [['A', rA], ['B', rB]] : [['B', rB], ['A', rA]];
      order.forEach(([n, r]) => wheel(ctx, xA, cy, r, st.phA, n === 'A' ? C.rose : C.acc));
    } else if (st.mode === 'engrenagem') {
      const d = rA + rB + 7;
      xA = w / 2 - d / 2; xB = w / 2 + d / 2;
      const nA = Math.max(6, Math.round(st.RAd * 2.4)), nB = Math.max(6, Math.round(st.RBd * 2.4));
      wheel(ctx, xA, cy, rA, st.phA, C.rose, nA);
      wheel(ctx, xB, cy, rB, -st.phA * nA / nB + Math.PI + Math.PI / nB, C.acc, nB);
    } else {
      xA = w * 0.27; xB = w * 0.73;
      st.belt += 2 * Math.PI * st.RA * k * fA * vis * dt;
      beltPath(ctx, xA, rA, xB, rB, cy, st.mode === 'cruzada', st.belt);
      wheel(ctx, xA, cy, rA, st.phA, C.rose);
      wheel(ctx, xB, cy, rB, st.phB, C.acc);
    }
    if (st.mode !== 'coaxial') {
      text(ctx, 'A', xA, cy - rA - 18, C.rose, 14, 'center', '700');
      text(ctx, 'B', xB, cy - rB - 18, C.acc, 14, 'center', '700');
    } else text(ctx, 'A e B no mesmo eixo', w / 2, 16, txt, 12, 'center');
    if (vis < 1) text(ctx, '(animação em câmera lenta)', w - 8, h - 12, txt, 11, 'right');
    const vA = 2 * Math.PI * st.RA / 100 * fA, vB = 2 * Math.PI * st.RB / 100 * fB;
    sh.readout(
      ro('f<sub>A</sub>', fmt(st.fA, 0) + ' rpm') + ro('f<sub>B</sub>', fmt(fB * 60, 1) + ' rpm') +
      ro('v<sub>A</sub> (borda)', fmt(vA, 3) + ' m/s') + ro('v<sub>B</sub> (borda)', fmt(vB, 3) + ' m/s') +
      ro('ω<sub>A</sub>', fmt(2 * Math.PI * fA, 2) + ' rad/s') + ro('ω<sub>B</sub>', fmt(2 * Math.PI * fB, 2) + ' rad/s')
    );
    const rule = st.mode === 'coaxial'
      ? 'Mesmo eixo → mesmo ω e mesma f. Quem tem raio maior tem v maior.'
      : `${st.mode === 'engrenagem' ? 'Contato' : 'Correia'} → mesma v na borda: f<sub>A</sub>·R<sub>A</sub> = f<sub>B</sub>·R<sub>B</sub>. ${st.RB < st.RA ? 'B é menor, então gira mais rápido!' : st.RB > st.RA ? 'B é maior, então gira mais devagar.' : 'Raios iguais → mesma f.'}`;
    sh.alert('info', `${rule}<br>Sentido: <b>${opposite ? 'OPOSTO' : 'o MESMO'}</b>`);
  }
  function drawBike(dt) {
    ease(dt);
    const { ctx, w, h } = sh, cy = h / 2 + 10, txt = cssv('--sim-line');
    const fP = st.fp / 60, fR = fP * st.ncor / st.ncat;
    const v = 2 * Math.PI * 0.35 * fR;
    const vis = Math.min(1, 1.6 / fR);
    st.phA += 2 * Math.PI * fP * vis * dt;
    st.phB = st.phA * st.ncor / st.ncat;
    st.belt += dt * vis * fP * st.ncor * 6;
    ctx.clearRect(0, 0, w, h);
    const rw = Math.min(h * 0.4, w * 0.25), xw = w * 0.3;
    const kk = rw * 0.0115;
    const rcat = st.ncatd * kk, rcor = st.ncord * kk, xc = w * 0.77;
    // roda traseira
    ctx.save(); ctx.translate(xw, cy); ctx.rotate(-st.phB);
    ctx.strokeStyle = txt; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, rw, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1; ctx.globalAlpha = 0.5;
    for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * rw, Math.sin(a) * rw); ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.fillStyle = C.ochre; ctx.beginPath(); ctx.arc(rw, 0, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    beltPath(ctx, xw, rcat, xc, rcor, cy, false, -st.belt);
    wheel(ctx, xw, cy, rcat, st.phB, C.acc, Math.round(st.ncatd));
    wheel(ctx, xc, cy, rcor, st.phA, C.rose, Math.round(st.ncord));
    // pedal
    const pl = rcor + 16, pxp = xc + Math.cos(-st.phA + Math.PI) * pl, pyp = cy + Math.sin(-st.phA + Math.PI) * pl;
    line(ctx, xc, cy, pxp, pyp, txt, 4); ctx.fillStyle = txt; ctx.fillRect(pxp - 9, pyp - 3, 18, 6);
    text(ctx, 'catraca', xw, cy + rcat + 20, C.acc, 12, 'center');
    text(ctx, 'coroa + pedal', xc, cy + rcor + 26, C.rose, 12, 'center');
    if (vis < 1) text(ctx, '(câmera lenta)', w - 8, 14, txt, 11, 'right');
    sh.readout(
      ro('f do pedal = f da coroa', fmt(fP, 2) + ' Hz') + ro('f catraca = f roda', fmt(fR, 2) + ' Hz') +
      ro('Velocidade', `${fmt(v, 1)} m/s = ${fmt(v * 3.6, 1)} km/h`) + ro('Relação', fmt(st.ncor / st.ncat, 2) + ' voltas da roda por pedalada')
    );
    sh.alert(st.ncor / st.ncat >= 2.5 ? 'ok' : 'info', st.ncor / st.ncat >= 2.5
      ? 'Marcha “pesada”: coroa grande + catraca pequena = muito rápido (mas pesado pra subir ladeira)!'
      : 'Marcha “leve”: fica fácil pedalar, mas a bike anda menos por pedalada.');
  }
  const stopLoop = loop(dt => (st.mode === 'bike' ? drawBike(dt) : drawGears(dt)));
  const redraw = () => (st.mode === 'bike' ? drawBike(0) : drawGears(0));
  const off = onResize(sh, redraw);
  return { stop() { stopLoop(); off(); }, redraw };
};

/* ---------- SIM 6: DINÂMICA ---------- */
SIMS[6] = function (box) {
  const CASES = {
    plana: { l: 'Curva plana', v: 15, R: 50, m: 1000, mu: 0.5 },

    bindSlider(box, 'dv', '', v => { st.v = v; tw.kick(); }, vtxt);
    $('#dv-v', box).textContent = vtxt(st.v);
    bindSlider(box, 'dr', ' m', v => { st.R = v; tw.kick(); });
    bindSlider(box, 'dm', ' kg', v => { st.m = v; tw.kick(); }, v => v.toFixed(0));
    if (c.mu !== undefined) bindSlider(box, 'dmu', '', v => { st.mu = v; tw.kick(); });
    if (c.th !== undefined) bindSlider(box, 'dth', '°', v => { st.th = v; tw.kick(); }, v => v.toFixed(0));
  }
  bindSeg(box, 'dc', k => { Object.assign(st, { mu: undefined, th: undefined }, CASES[k], { c: k }); controls(); tw.snap(); sh.flash(); draw(); });
  controls();
  const N = x => `${fmt(x, 0)} N`;
  function car(ctx, x, y, ang, color = C.rose) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-20, -18, 40, 14, 5) : ctx.rect(-20, -18, 40, 14); ctx.fill();
    ctx.fillRect(-11, -26, 22, 9);
    ctx.fillStyle = C.gray; ctx.beginPath(); ctx.arc(-12, -4, 5, 0, Math.PI * 2); ctx.arc(12, -4, 5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function draw() {
    const D = tw.D;
    const { ctx, w, h } = sh, txt = cssv('--sim-line');
    ctx.clearRect(0, 0, w, h);
    const { v, R, m } = D, P = m * g, Fcp = m * v * v / R;
    const sc = F => clamp(F / Math.max(P, 1) * 55, 0, 110);
    const PC = C.red, NC = C.blue, AC = C.sage, TC = C.ochre;
    const cx = w / 2;
    let rd = '', al = ['ok', ''];
    switch (st.c) {
      case 'plana': {
        const vmax = Math.sqrt(D.mu * g * R), skid = v > vmax;
        const rr = Math.min(w * 0.36, h * 0.38), cyc = h / 2 + 10;
        ctx.save(); ctx.strokeStyle = C.gray2; ctx.lineWidth = 26; ctx.globalAlpha = 0.45; ctx.beginPath(); ctx.arc(cx, cyc, rr, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        text(ctx, 'vista de cima', 8, 14, txt, 11);
        ctx.fillStyle = txt; ctx.beginPath(); ctx.arc(cx, cyc, 3, 0, Math.PI * 2); ctx.fill(); text(ctx, 'centro', cx, cyc + 14, txt, 11, 'center');
        if (skid) { line(ctx, cx, cyc - rr, cx + rr * 1.2, cyc - rr - 10, PC, 2, [6, 5]); text(ctx, 'derrapa!', cx + rr * 0.8, cyc - rr - 26, PC, 13, 'center', '700'); }
        car(ctx, cx, cyc - rr + 10, 0);
        arrow(ctx, cx, cyc - rr, cx, cyc - rr + Math.min(sc(Math.min(Fcp, D.mu * P)), rr - 10), AC, 4, 'Fat');
        arrow(ctx, cx + 24, cyc - rr - 8, cx + 70, cyc - rr - 8, NC, 3, 'v');
        rd = ro('F꜀ₚ necessária = mv²/R', N(Fcp)) + ro('Atrito máximo = μmg', N(D.mu * P)) + ro('v máxima = √(μgR)', `${fmt(vmax, 1)} m/s (${fmt(vmax * 3.6, 0)} km/h)`);
        al = skid ? ['bad', `DERRAPOU! Precisa de ${N(Fcp)}, mas o atrito só dá ${N(D.mu * P)}.`] : ['ok', 'O atrito segura o carro na curva. (Diminua μ para simular pista molhada!)'];
        break;
      }
      case 'inclinada': {
        const th = D.th * DEG, vi = Math.sqrt(R * g * Math.tan(th));
        const L = Math.min(w * 0.7, 360), x0 = cx - L / 2, y0 = h * 0.78;
        const x1 = x0 + L * Math.cos(th), y1 = y0 - L * Math.sin(th);
        ctx.fillStyle = rgba(C.gray2, 0.35); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x1, y0); ctx.closePath(); ctx.fill();
        line(ctx, x0, y0, x1, y1, txt, 3);
        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
        car(ctx, mx, my, -th);
        const Nn = P / Math.cos(th), ox = mx, oy = my - 14;
        arrow(ctx, ox, oy, ox, oy + sc(P), PC, 4, 'P');
        arrow(ctx, ox, oy, ox - Math.sin(th) * sc(Nn), oy - Math.cos(th) * sc(Nn), NC, 4, 'N');
        arrow(ctx, ox, oy + 26, ox - Math.sin(th) * sc(Nn), oy + 26, AC, 2.5, 'N·sen θ', 22);
        text(ctx, '← centro da curva', x0 + 4, y0 + 16, txt, 12);
        text(ctx, `θ = ${Math.round(D.th)}°`, x1 - 50, y0 - 10, txt, 12);
        rd = ro('v ideal = √(Rg·tg θ)', `${fmt(vi, 1)} m/s (${fmt(vi * 3.6, 0)} km/h)`) + ro('N = P/cos θ', N(Nn)) + ro('F꜀ₚ = N·sen θ', N(Nn * Math.sin(th)));
        const tol = 0.06 * vi + 0.3;
        al = Math.abs(v - vi) <= tol ? ['ok', 'Velocidade ideal: a componente horizontal da normal faz a curva sozinha, sem precisar de atrito!']
          : v > vi ? ['bad', 'Rápido demais para essa inclinação: sem atrito, o carro escapa para FORA da curva.']
            : ['info', 'Devagar demais: sem atrito, o carro escorrega para DENTRO (para baixo).'];
        break;
      }
      case 'lombada': case 'depressao': {
        const top = st.c === 'lombada';
        const Nv = top ? m * (g - v * v / R) : m * (g + v * v / R);
        const rr = Math.min(w * 0.55, 260), yc = top ? h * 0.42 + rr : h * 0.6 - rr;
        ctx.save(); ctx.strokeStyle = txt; ctx.lineWidth = 3; ctx.beginPath();
        if (top) ctx.arc(cx, yc, rr, Math.PI * 1.2, Math.PI * 1.8); else ctx.arc(cx, yc, rr, Math.PI * 0.2, Math.PI * 0.8);
        ctx.stroke(); ctx.restore();
        const sy = top ? yc - rr : yc + rr;
        const flying = top && Nv < 0;
        car(ctx, cx, sy - (flying ? 20 : 0), 0);
        const oy = sy - (flying ? 32 : 12);
        arrow(ctx, cx, oy, cx, oy + sc(P), PC, 4, 'P');
        if (!flying) arrow(ctx, cx + 26, sy, cx + 26, sy - sc(Math.max(Nv, 0)), NC, 4, 'N');
        text(ctx, top ? 'centro da curva ↓ (embaixo)' : 'centro da curva ↑ (em cima)', 8, 14, txt, 11);
        rd = ro(top ? 'N = m(g − v²/R)' : 'N = m(g + v²/R)', N(Math.max(Nv, 0))) + ro('Peso P', N(P)) + ro('N/P (“peso que você sente”)', fmt(Math.max(Nv, 0) / P, 2) + '×') +
          (top ? ro('v máx sem voar = √(gR)', `${fmt(Math.sqrt(g * R), 1)} m/s (${fmt(Math.sqrt(g * R) * 3.6, 0)} km/h)`) : '');
        al = top ? (flying ? ['bad', 'PERDEU CONTATO! v > √(gR): o peso não dá conta de fazer a curva e o carro “voa”.'] : ['ok', `No topo P − N = mv²/R → N < P (frio na barriga). Você se sente ${fmt(Nv / P, 2)}× o seu peso.`])
          : ['info', `No fundo N − P = mv²/R → N > P. Você se sente ${fmt(Nv / P, 2)}× mais pesada!`];
        break;
      }
      case 'looping': case 'fio': {
        const loopC = st.c === 'looping';
        const rr = Math.min(h * 0.38, w * 0.3), cyc = h / 2;
        ctx.save(); ctx.strokeStyle = txt; ctx.lineWidth = loopC ? 5 : 1.5; if (!loopC) ctx.setLineDash([5, 5]); ctx.globalAlpha = loopC ? 1 : 0.5;
        ctx.beginPath(); ctx.arc(cx, cyc, rr, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        const vmin = Math.sqrt(g * R);
        const Ftop = m * (v * v / R - g);
        if (loopC) {
          const fall = Ftop < 0;
          car(ctx, cx, cyc - rr + (fall ? 30 : 4), Math.PI);
          arrow(ctx, cx - 30, cyc - rr + 8, cx - 30, cyc - rr + 8 + sc(P), PC, 4, 'P');
          if (!fall) arrow(ctx, cx + 30, cyc - rr + 8, cx + 30, cyc - rr + 8 + sc(Ftop), NC, 4, 'N');
          rd = ro('No topo: N + P = mv²/R → N', N(Math.max(Ftop, 0))) + ro('v mínima = √(gR)', `${fmt(vmin, 2)} m/s`) + ro('F꜀ₚ = mv²/R', N(Fcp));
          al = fall ? ['bad', 'Velocidade insuficiente! v < √(gR): o carrinho cai do looping.'] : Math.abs(Ftop) < P * 0.05 ? ['info', 'Quase no limite: N ≈ 0 e só o peso faz a curva (v = √(gR)).'] : ['ok', 'Passou pelo topo! Peso + normal fazem a resultante centrípeta.'];
        } else {
          const Tb = m * (g + v * v / R);
          line(ctx, cx, cyc, cx, cyc + rr, TC, 2); line(ctx, cx, cyc, cx, cyc - rr, TC, 2, Ftop < 0 ? [3, 4] : null);
          ctx.fillStyle = C.gray; [cyc + rr, cyc - rr].forEach(y => { ctx.beginPath(); ctx.arc(cx, y, 10, 0, Math.PI * 2); ctx.fill(); });
          const sx = Math.min(sc(P), rr - 14) / sc(P) || 1; // encolhe as setas se o círculo for pequeno
          arrow(ctx, cx + 16, cyc + rr, cx + 16, cyc + rr + Math.min(sc(P), h - (cyc + rr) - 4), PC, 4, 'P');
          arrow(ctx, cx - 16, cyc + rr, cx - 16, cyc + rr - Math.min(sc(Tb), rr * 0.45), TC, 4, 'T');
          arrow(ctx, cx + 16, cyc - rr, cx + 16, cyc - rr + sc(P) * sx, PC, 3, 'P');
          if (Ftop > 0) arrow(ctx, cx - 16, cyc - rr, cx - 16, cyc - rr + Math.min(sc(Ftop), rr * 0.45), TC, 3, 'T');
          text(ctx, 'ponto mais baixo', cx + 30, cyc + rr - 14, txt, 11);
          text(ctx, 'ponto mais alto', cx + 30, cyc - rr - 4, txt, 11);
          rd = ro('Embaixo: T = m(g + v²/R)', N(Tb)) + ro('Em cima: T = m(v²/R − g)', Ftop < 0 ? 'fio afrouxa!' : N(Ftop)) + ro('Peso', N(P));
          al = Ftop < 0 ? ['bad', `No topo o fio AFROUXA: v < √(gR) = ${fmt(vmin, 2)} m/s.`] : ['ok', 'Tração máxima no ponto mais BAIXO (T − P = mv²/R): é ali que o fio pode arrebentar!'];
        }
        break;
      }
      case 'rotor': {
        const Nn = Fcp, mumin = v > 0 ? g * R / (v * v) : Infinity, ok = D.mu >= mumin;
        const ww = Math.min(w * 0.6, 280), x0 = cx - ww / 2, x1 = cx + ww / 2, y0 = 20, y1 = h - 20;
        ctx.save(); ctx.strokeStyle = txt; ctx.lineWidth = 4; line(ctx, x0, y0, x0, y1, txt, 5); line(ctx, x1, y0, x1, y1, txt, 5);
        ctx.setLineDash([4, 4]); line(ctx, cx, y0, cx, y1, txt, 1.5); ctx.restore();
        text(ctx, 'eixo', cx + 4, y0 + 6, txt, 11);
        const py = ok ? h * 0.42 : h * 0.62;
        ctx.save(); ctx.strokeStyle = txt; ctx.lineWidth = 1.8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(x0 + 18, py - 16, 5, 0, Math.PI * 2); ctx.moveTo(x0 + 18, py - 11); ctx.lineTo(x0 + 18, py + 6); ctx.moveTo(x0 + 18, py + 6); ctx.lineTo(x0 + 13, py + 18); ctx.moveTo(x0 + 18, py + 6); ctx.lineTo(x0 + 23, py + 18); ctx.moveTo(x0 + 12, py - 5); ctx.lineTo(x0 + 24, py - 5); ctx.stroke(); ctx.restore();
        arrow(ctx, x0 + 10, py, x0 + 10 + sc(Nn), py, NC, 4, 'N');
        arrow(ctx, x0 + 34, py, x0 + 34, py + sc(P), PC, 4, 'P');
        arrow(ctx, x0 + 34, py, x0 + 34, py - sc(Math.min(P, D.mu * Nn)), AC, 4, 'Fat');
        if (!ok) text(ctx, 'escorregando', x0 + 50, py + 40, PC, 13, 'left', '700');
        rd = ro('N = mv²/R', N(Nn)) + ro('Atrito máx = μN', N(D.mu * Nn)) + ro('Peso', N(P)) + ro('μ mínimo = gR/v²', isFinite(mumin) ? fmt(mumin, 2) : '∞');
        al = ok ? ['ok', 'A normal (da parede) é a centrípeta e o atrito segura o peso: fica “grudada” na parede!'] : ['bad', 'Escorrega! μN < P. Aumente v ou μ.'];
        break;
      }
      case 'conico': {
        const th = Math.atan(v * v / (R * g)), T = P / Math.cos(th);
        const Lp = Math.min(h * 0.75, 200), px = cx, py = 18;
        const bx = px + Lp * Math.sin(th), by = py + Lp * Math.cos(th);
        ctx.save(); ctx.strokeStyle = txt; ctx.globalAlpha = 0.4; ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.ellipse(px, by, Math.max(2, bx - px), Math.max(2, (bx - px) * 0.25), 0, 0, Math.PI * 2); ctx.stroke();
        line(ctx, px, py, px, by, txt, 1.5, [3, 3]); ctx.restore();
        line(ctx, px - 30, py, px + 30, py, txt, 4);
        line(ctx, px, py, bx, by, TC, 2.5);
        ctx.fillStyle = C.gray; ctx.beginPath(); ctx.arc(bx, by, 11, 0, Math.PI * 2); ctx.fill();
        arrow(ctx, bx, by, bx, by + sc(P), PC, 4, 'P');
        arrow(ctx, bx, by, bx - Math.sin(th) * sc(T), by - Math.cos(th) * sc(T), TC, 4, 'T');
        arrow(ctx, bx, by + 18, bx - Math.sin(th) * sc(T), by + 18, AC, 2.5, 'F꜀ₚ');
        text(ctx, `θ = ${fmt(th / DEG, 1)}°`, px + 8, py + 34, txt, 12);
        rd = ro('tg θ = v²/(Rg)', `θ = ${fmt(th / DEG, 1)}°`) + ro('T = P/cos θ', N(T)) + ro('F꜀ₚ = T·sen θ', N(T * Math.sin(th)));
        al = ['info', 'A componente horizontal da tração é a centrípeta. Mais rápido → o fio abre mais (θ maior).'];
        break;
      }
    }
    sh.readout(rd + ro('F꜀ₚ = mv²/R', N(Fcp)));
    sh.alert(al[0], al[1]);
  }
  const tw = smooth(st, ['v', 'R', 'm', 'mu', 'th'], draw);
  draw();
  const off = onResize(sh, draw);
  return { stop() { off(); tw.stop(); }, redraw: draw };
};

/* ================= INÍCIO ================= */
applyTheme();
if (window.matchMedia) {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const onChange = () => { if (!S.theme) { applyTheme(); if (activeSim && activeSim.redraw) activeSim.redraw(); } };
  mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
}
route();
</script>
</body>
